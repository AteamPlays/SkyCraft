plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'skycraft-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--username', (System.getenv('SKYCRAFT_USERNAME') ?: 'Dovahkiin')
        }
    }

    mods {
        skycraft {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Minecraft 1.21.1 already uses JNA on Windows. Declare it explicitly so the
    // shared-memory bridge is available to the development compiler as well.
    implementation 'net.java.dev.jna:jna:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-api:2.0.17'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'SkyCraft NeoForge',
            'Implementation-Version': project.version
        )
    }
}
