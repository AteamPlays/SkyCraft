plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'skycraft-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { url = 'https://maven.ryanhcode.dev/releases' } // Sable / Simulated project
    maven { url = 'https://maven.ryanhcode.dev/snapshots' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            programArguments.addAll '--username', (System.getenv('SKYCRAFT_USERNAME') ?: 'Dovahkiin')
        }
    }

    mods {
        skycraft {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Minecraft 1.21.1 already uses JNA on Windows. Declare it explicitly so the
    // shared-memory bridge is available to the development compiler as well.
    implementation 'net.java.dev.jna:jna:5.14.0'

    // Official Create 6.0.10 NeoForge 1.21.1 development stack. Create remains optional
    // for end users; this pins CI/dev to the API we are porting SkyCraft against.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Released Create: Aeronautics stack used by the real dev run. The published Sable jar
    // already bundles Veil, while the Aeronautics release bundles Simulated + Offroad.
    // Modrinth Maven has no transitive metadata, so both required top-level mods are explicit.
    implementation("maven.modrinth:T9PomCSv:${sable_modrinth_version}")
    implementation("maven.modrinth:oWaK0Q19:${aeronautics_modrinth_version}")

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-api:2.0.17'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'SkyCraft NeoForge',
            'Implementation-Version': project.version
        )
    }
}
